<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6e8f7">

<title>Profe EDO · Amira</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f4a6cf'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='30' font-style='italic' text-anchor='middle' fill='white'%3Ey'%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/katex/katex.min.css">
<script defer src="lib/katex/katex.min.js"></script>
<script defer src="lib/marked.min.js"></script>
<script defer src="lib/purify.min.js"></script>
<style>
:root{
  --fondo:#fdf6fb; --fondo2:#f6ecfb; --tarjeta:#ffffff; --borde:#efdcf0;
  --rosa:#f4a6cf; --rosa-suave:#fde4f1; --lila:#c9b6f7; --lila-suave:#efe8fd;
  --morado:#8b5cf6; --morado-osc:#6d3fd6; --texto:#3b2747; --texto2:#7c6889;
  --ok:#4fb68d; --error:#e0607e;
  --grad:linear-gradient(135deg,#f6a5cd 0%,#c4a7f7 100%);
  --sombra:0 6px 24px rgba(139,92,246,.10);
  --radio:20px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--texto);
  background:radial-gradient(1200px 600px at 100% -10%,#f3e6ff 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#ffe3f1 0%,transparent 60%),var(--fondo);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto}

/* Cabecera */
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--borde);position:relative;z-index:5}
.icono{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--morado-osc);flex:none}
.icono:hover{background:var(--lila-suave)}
.icono svg{width:22px;height:22px}
.avatar{width:42px;height:42px;border-radius:15px;background:var(--grad);display:grid;place-items:center;color:#fff;font:italic 600 22px Georgia,serif;flex:none;box-shadow:0 4px 12px rgba(196,167,247,.5)}
.titulo{flex:1;min-width:0}
.titulo b{display:block;font-size:17px;font-weight:800;line-height:1.15}
.titulo small{display:block;font-size:12.5px;color:var(--texto2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Chat */
main{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
.bienvenida{background:var(--tarjeta);border:1px solid var(--borde);border-radius:24px;padding:20px 18px;box-shadow:var(--sombra);margin-bottom:16px}
.bienvenida h1{margin:0 0 6px;font-size:23px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bienvenida p{margin:0 0 14px;color:var(--texto2);line-height:1.5;font-size:15px}
.semana{display:flex;gap:10px;align-items:center;background:var(--lila-suave);border-radius:16px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.semana .num{background:var(--morado);color:#fff;border-radius:11px;padding:4px 9px;font-weight:800;font-size:13px;white-space:nowrap}
.unidad{border-top:1px dashed var(--borde);padding-top:10px;margin-top:10px}
.unidad summary{list-style:none;cursor:pointer;font-weight:800;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.unidad summary::-webkit-details-marker{display:none}
.unidad summary::after{content:'+';color:var(--morado);font-size:20px;font-weight:700}
.unidad[open] summary::after{content:'–'}
.unidad .actual{font-size:11px;background:var(--rosa-suave);color:#b03a78;border-radius:8px;padding:2px 7px;margin-left:6px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:8px 0 4px}
.chip{background:var(--fondo2);border:1px solid var(--borde);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--texto);text-align:left}
.chip:hover,.chip:active{background:var(--rosa-suave);border-color:var(--rosa)}
.consejos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.consejo{background:var(--fondo2);border-radius:14px;padding:10px 11px;font-size:13px;color:var(--texto2);line-height:1.35}
.consejo b{color:var(--texto);display:block;font-size:13.5px;margin-bottom:2px}

.msg{display:flex;margin:10px 0;gap:8px;align-items:flex-end}
.msg.yo{justify-content:flex-end}
.burbuja{max-width:88%;border-radius:22px;padding:11px 15px;line-height:1.55;font-size:15.5px;overflow-wrap:anywhere}
.yo .burbuja{background:var(--grad);color:#fff;border-bottom-right-radius:8px;box-shadow:0 4px 14px rgba(196,167,247,.45)}
.profe .burbuja{background:var(--tarjeta);border:1px solid var(--borde);border-bottom-left-radius:8px;box-shadow:var(--sombra);max-width:100%;flex:1;min-width:0}
.mini{width:30px;height:30px;border-radius:11px;font-size:16px;flex:none;align-self:flex-start;margin-top:2px}
.burbuja p{margin:0 0 .6em}.burbuja p:last-child{margin-bottom:0}
.burbuja ol,.burbuja ul{margin:.3em 0 .6em;padding-left:1.35em}
.burbuja li{margin:.25em 0}
.burbuja strong{color:var(--morado-osc)}
.yo .burbuja strong{color:#fff}
.burbuja h1,.burbuja h2,.burbuja h3{font-size:16.5px;margin:.6em 0 .3em;color:var(--morado-osc)}
.burbuja code{background:var(--lila-suave);border-radius:6px;padding:1px 5px;font-size:.92em}
.burbuja pre{background:var(--lila-suave);border-radius:12px;padding:10px;overflow-x:auto}
.burbuja blockquote{margin:.5em 0;padding:.4em .8em;border-left:4px solid var(--rosa);background:var(--rosa-suave);border-radius:0 12px 12px 0}
.burbuja table{border-collapse:collapse;display:block;overflow-x:auto;font-size:14px}
.burbuja td,.burbuja th{border:1px solid var(--borde);padding:4px 8px}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 2px;margin:.55em 0}
.katex{font-size:1.06em}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fotos img{width:120px;max-height:150px;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.7);cursor:zoom-in}
.etiqueta{display:inline-block;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.28);border-radius:8px;padding:1px 7px;margin-bottom:5px}
.pensando{display:inline-flex;gap:5px;align-items:center;color:var(--texto2);font-size:14px}
.pensando i{width:7px;height:7px;border-radius:50%;background:var(--lila);animation:rebote 1.2s infinite}
.pensando i:nth-child(2){animation-delay:.15s}.pensando i:nth-child(3){animation-delay:.3s}
@keyframes rebote{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
.cursor::after{content:'▍';color:var(--rosa);animation:parpadeo 1s steps(2) infinite}
@keyframes parpadeo{50%{opacity:0}}
.acciones{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 10px 38px}
.accion{background:var(--tarjeta);border:1.5px solid var(--lila);color:var(--morado-osc);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700}
.accion:hover{background:var(--lila-suave)}
.accion.rosa{border-color:var(--rosa);color:#b03a78}
.aviso{background:#fff1f4;border:1px solid #f6c2cf;color:#a3304e;border-radius:16px;padding:10px 13px;font-size:14px;margin:8px 0 8px 38px}
.aviso button{color:#a3304e;font-weight:800;text-decoration:underline;margin-left:4px}

/* Compositor */
footer{padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--borde)}
.modo{display:flex;background:var(--fondo2);border-radius:14px;padding:3px;margin-bottom:8px;font-size:13px;font-weight:700}
.modo button{flex:1;border-radius:11px;padding:6px 4px;color:var(--texto2)}
.modo button.on{background:#fff;color:var(--morado-osc);box-shadow:0 2px 8px rgba(139,92,246,.15)}
.previas{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.previa{position:relative}
.previa img{width:64px;height:64px;object-fit:cover;border-radius:14px;border:2px solid var(--lila)}
.previa button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--texto);color:#fff;font-size:13px;line-height:22px}
.fila{display:flex;align-items:flex-end;gap:8px}
.fila textarea{flex:1;resize:none;border:1.5px solid var(--borde);border-radius:20px;padding:11px 15px;font:inherit;font-size:16px;color:var(--texto);background:#fff;max-height:140px;line-height:1.35;outline:none}
.fila textarea:focus{border-color:var(--lila);box-shadow:0 0 0 4px var(--lila-suave)}
.btn-foto{width:46px;height:46px;border-radius:16px;background:var(--rosa-suave);color:#b03a78;display:grid;place-items:center;flex:none}
.btn-enviar{width:46px;height:46px;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(196,167,247,.55)}
.btn-enviar:disabled{opacity:.45;box-shadow:none}
.btn-foto svg,.btn-enviar svg{width:22px;height:22px}

/* Cajón del historial */
.velo{position:fixed;inset:0;background:rgba(59,39,71,.28);opacity:0;pointer-events:none;transition:.2s;z-index:10}
.velo.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;bottom:0;left:0;width:min(330px,86vw);background:#fff;z-index:11;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding:16px;padding-top:max(16px,env(safe-area-inset-top));box-shadow:8px 0 30px rgba(59,39,71,.12)}
aside.on{transform:none}
aside h2{margin:4px 4px 12px;font-size:18px;font-weight:800}
.nueva{background:var(--grad);color:#fff;border-radius:16px;padding:12px;font-weight:800;margin-bottom:12px}
.lista{flex:1;overflow-y:auto}
.item{display:flex;align-items:center;gap:6px;border-radius:14px;padding:4px 4px 4px 12px;margin-bottom:4px}
.item.on{background:var(--lila-suave)}
.item .abrir{flex:1;text-align:left;padding:7px 0;min-width:0}
.item .abrir b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .abrir small{color:var(--texto2);font-size:12px}
.item .borrar{width:34px;height:34px;border-radius:10px;color:var(--texto2);flex:none}
.item .borrar:hover{background:var(--rosa-suave);color:var(--error)}
.pie-cajon{font-size:12px;color:var(--texto2);line-height:1.45;padding:10px 4px 0;border-top:1px solid var(--borde)}
.pie-cajon button{color:var(--morado-osc);font-weight:700;text-decoration:underline}

/* Pantalla del código */
.acceso{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:radial-gradient(800px 500px at 80% 0%,#efe2ff,transparent 60%),radial-gradient(700px 500px at 0% 100%,#ffe0ef,transparent 60%),var(--fondo)}
.acceso.on{display:grid}
.caja{background:#fff;border-radius:28px;padding:28px 22px;width:min(380px,100%);text-align:center;box-shadow:var(--sombra);border:1px solid var(--borde)}
.caja .avatar{width:64px;height:64px;border-radius:22px;font-size:32px;margin:0 auto 14px}
.caja h1{margin:0 0 6px;font-size:24px;font-weight:800}
.caja p{color:var(--texto2);margin:0 0 18px;line-height:1.5}
.caja input{width:100%;border:1.5px solid var(--borde);border-radius:16px;padding:13px 15px;font:inherit;font-size:17px;text-align:center;outline:none;margin-bottom:12px}
.caja input:focus{border-color:var(--lila);box-shadow:0 0 0 4px var(--lila-suave)}
.caja .entrar{width:100%;background:var(--grad);color:#fff;border-radius:16px;padding:13px;font-weight:800;font-size:16px}
.caja .err{color:var(--error);font-size:14px;min-height:20px;margin-top:10px}

/* Visor de foto */
.visor{position:fixed;inset:0;background:rgba(30,18,40,.9);z-index:30;display:none;place-items:center;padding:16px}
.visor.on{display:grid}
.visor img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="icono" id="bHistorial" aria-label="Mis conversaciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div class="avatar" aria-hidden="true">y'</div>
    <div class="titulo"><b>Profe EDO</b><small id="subtitulo">Tu profe de Ecuaciones Diferenciales</small></div>
    <button class="icono" id="bNueva" aria-label="Nueva conversación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <div class="modo" role="tablist" aria-label="Cómo quieres la ayuda">
      <button id="mPaso" class="on" role="tab">Paso a paso, conmigo</button>
      <button id="mTodo" role="tab">Solución completa</button>
    </div>
    <div class="previas" id="previas"></div>
    <div class="fila">
      <button class="btn-foto" id="bFoto" aria-label="Enviar foto de un ejercicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <input type="file" id="archivo" accept="image/*" multiple hidden>
      <textarea id="texto" rows="1" placeholder="Escribe tu duda…"></textarea>
      <button class="btn-enviar" id="bEnviar" aria-label="Enviar" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
    </div>
  </footer>
</div>

<div class="velo" id="velo"></div>
<aside id="cajon" aria-label="Mis conversaciones">
  <h2>Mis conversaciones</h2>
  <button class="nueva" id="bNueva2">+ Nueva conversación</button>
  <div class="lista" id="lista"></div>
  <div class="pie-cajon">Tus conversaciones y fotos se guardan solo en este celular.<br><button id="bSalir">Cambiar código de acceso</button></div>
</aside>

<div class="acceso" id="acceso">
  <form class="caja" id="fAcceso">
    <div class="avatar" aria-hidden="true">y'</div>
    <h1>¡Hola, Amira!</h1>
    <p>Soy tu profe de Ecuaciones Diferenciales. Escribe tu código de acceso para empezar.</p>
    <input id="codigo" type="password" autocomplete="current-password" placeholder="Código de acceso" required>
    <button class="entrar" type="submit">Entrar</button>
    <div class="err" id="errAcceso"></div>
  </form>
</div>

<div class="visor" id="visor"><img alt="Foto del ejercicio"></div>

<script>
/* ===================== Configuración ===================== */
// Dirección del Worker de Cloudflare (se completa al instalarlo). Para pruebas: ?api=http://localhost:8787
const API = new URLSearchParams(location.search).get('api') || 'https://profe-edo.REEMPLAZAR.workers.dev';
const NOMBRE = 'Amira';
const INICIO_CICLO = Date.UTC(2026, 7, 31, 5);
const MAX_FOTOS = 3, LADO_MAX = 1568;

const UNIDADES = [
  { n: 'I', t: 'EDO de primer orden', sem: [1, 4], temas: ['Separación de variables', 'EDO homogéneas', 'Reducibles a homogéneas', 'EDO exactas', 'Factor de integración', 'EDO lineales de primer orden', 'Bernoulli', 'Riccati', 'Clairaut y Lagrange', 'Aplicaciones de primer orden'] },
  { n: 'II', t: 'EDO de orden superior', sem: [5, 8], temas: ['Independencia lineal y Wronskiano', 'Ecuación característica', 'Coeficientes indeterminados', 'Variación de parámetros', 'Ecuación de Euler (Cauchy-Euler)', 'Aplicaciones: masa-resorte y vibraciones'] },
  { n: 'III', t: 'Series y transformada de Laplace', sem: [9, 12], temas: ['Criterios de convergencia', 'Solución por series de potencias', 'Transformada de Laplace y propiedades', 'Transformada inversa de Laplace', 'EDO con Laplace', 'Sistemas de EDO lineales'] },
  { n: 'IV', t: 'Series de Fourier y EDP', sem: [13, 16], temas: ['Series de Fourier', 'Transformada de Fourier', 'Transformada inversa de Fourier', 'Problema de Sturm-Liouville', 'Series de Bessel y Legendre', 'EDP separables', 'Ecuación del calor', 'Ecuación de onda'] },
];
const SEMANAS = ['Separación de variables', 'Homogéneas y exactas', 'Factor integrante y lineales', 'Bernoulli, Riccati, Clairaut, Lagrange', 'Orden superior y Wronskiano', 'Ecuación característica y coef. indeterminados', 'Variación de parámetros y Euler', 'Evaluación parcial', 'Series de potencias', 'Transformada de Laplace', 'EDO con Laplace', 'Sistemas de EDO', 'Series y transformada de Fourier', 'Sturm-Liouville, Bessel y Legendre', 'EDP separables', 'Evaluación final'];

/* ===================== Utilidades ===================== */
const $ = s => document.querySelector(s);
const chatEl = $('#chat'), textoEl = $('#texto'), enviarEl = $('#bEnviar');
const semana = () => Math.floor((Date.now() - INICIO_CICLO) / (7 * 864e5)) + 1;
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} }, del(k) { try { localStorage.removeItem(k) } catch {} } };

/* Markdown + fórmulas (KaTeX). Las fórmulas se apartan antes del markdown para que no se dañen. */
function renderizar(md) {
  const formulas = [];
  const guardar = (tex, bloque) => { formulas.push({ tex, bloque }); return `⟦F${formulas.length - 1}⟧`; };
  let s = md
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => '\n\n' + guardar(t, true) + '\n\n')
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => '\n\n' + guardar(t, true) + '\n\n')
    .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => guardar(t, false))
    .replace(/(^|[^\\$])\$([^\s$](?:[^$\n]*?[^\s\\$])?)\$(?!\d)/g, (_, a, t) => a + guardar(t, false));
  let html = (window.marked ? marked.parse(s, { breaks: true, gfm: true }) : esc(s).replace(/\n/g, '<br>'));
  html = window.DOMPurify ? DOMPurify.sanitize(html) : html;
  return html.replace(/(?:<p>)?⟦F(\d+)⟧(?:<\/p>)?/g, (m, i) => {
    const f = formulas[+i];
    if (!window.katex) return esc(f.bloque ? `$$${f.tex}$$` : `$${f.tex}$`);
    try { return katex.renderToString(f.tex, { displayMode: f.bloque, throwOnError: false, strict: 'ignore' }); }
    catch { return esc(f.tex); }
  });
}

/* Comprime la foto: lado mayor 1568 px, JPEG 85 %. */
function comprimir(file) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, LADO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('No pude abrir esa imagen.')); };
    img.src = url;
  });
}

/* ===================== Almacenamiento (IndexedDB, en el celular) ===================== */
const DB = {
  db: null,
  abrir() {
    return new Promise(ok => {
      try {
        const r = indexedDB.open('profe-edo', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('chats', { keyPath: 'id' });
        r.onsuccess = () => { this.db = r.result; ok(); };
        r.onerror = () => ok();
      } catch { ok(); }
    });
  },
  tx(modo, f) {
    return new Promise(ok => {
      if (!this.db) return ok(null);
      const t = this.db.transaction('chats', modo), st = t.objectStore('chats'), r = f(st);
      t.oncomplete = () => ok(r && r.result); t.onerror = () => ok(null);
    });
  },
  todos() { return this.tx('readonly', s => s.getAll()).then(r => (r || []).sort((a, b) => b.actualizado - a.actualizado)); },
  guardar(c) { return this.tx('readwrite', s => s.put(c)); },
  borrar(id) { return this.tx('readwrite', s => s.delete(id)); },
};

/* ===================== Estado ===================== */
let chat = null;            // {id, titulo, creado, actualizado, mensajes:[{role, content, ui}]}
let fotos = [];             // dataURL de las fotos por enviar
let modoCompleto = false;
let ocupado = false;

function nuevoChat() { chat = { id: 'c' + Date.now().toString(36), titulo: 'Nueva conversación', creado: Date.now(), actualizado: Date.now(), mensajes: [] }; pintar(); }

/* ===================== Pintado ===================== */
function bienvenida() {
  const w = semana();
  const enCiclo = w >= 1 && w <= 16;
  const uAct = UNIDADES.findIndex(u => w >= u.sem[0] && w <= u.sem[1]);
  const unidades = UNIDADES.map((u, i) => `
    <details class="unidad" ${i === uAct ? 'open' : ''}>
      <summary><span>Unidad ${u.n}: ${u.t}${i === uAct ? '<span class="actual">ahora</span>' : ''}</span></summary>
      <div class="chips">${u.temas.map(t => `<button class="chip" data-tema="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    </details>`).join('');
  return `<section class="bienvenida">
    <h1>¡Hola, ${NOMBRE}! 💜</h1>
    <p>Pregúntame cualquier tema del curso o mándame la foto de un ejercicio. Lo resolvemos paso a paso y te explico el porqué de cada paso.</p>
    ${enCiclo ? `<div class="semana"><span class="num">Semana ${w}</span><span>En clase: <b>${esc(SEMANAS[w - 1])}</b></span></div>` : ''}
    ${unidades}
    <div class="consejos">
      <div class="consejo"><b>📷 Foto del ejercicio</b>Que se vea derecha y con buena luz.</div>
      <div class="consejo"><b>✍️ Tu intento</b>Escríbeme lo que hiciste y lo reviso.</div>
    </div>
  </section>`;
}

function htmlMensaje(m, i) {
  if (m.role === 'user') {
    const ims = (m.ui.fotos || []).map(f => `<img src="${f}" alt="Foto enviada">`).join('');
    const et = m.ui.completo ? '<span class="etiqueta">Solución completa</span><br>' : '';
    return `<div class="msg yo"><div class="burbuja">${ims ? `<div class="fotos">${ims}</div>` : ''}${et}${m.ui.texto ? esc(m.ui.texto).replace(/\n/g, '<br>') : ''}</div></div>`;
  }
  return `<div class="msg profe"><div class="avatar mini" aria-hidden="true">y'</div><div class="burbuja" data-i="${i}">${renderizar(m.ui.texto || '')}</div></div>`;
}

function pintar() {
  let h = chat.mensajes.length ? '' : bienvenida();
  h += chat.mensajes.map(htmlMensaje).join('');
  const ult = chat.mensajes[chat.mensajes.length - 1];
  if (ult && ult.role === 'assistant') h += `<div class="acciones">
      <button class="accion" data-rapido="Ok, ¿cuál es el siguiente paso?">Siguiente paso</button>
      <button class="accion" data-rapido="No entendí ese último paso, ¿me lo explicas de otra forma, más despacio?">No entendí</button>
      <button class="accion rosa" data-rapido="Muéstrame la solución completa de este ejercicio, ordenada." data-completo="1">Muéstrame todo</button>
    </div>`;
  chatEl.innerHTML = h;
  $('#subtitulo').textContent = chat.mensajes.length ? chat.titulo : 'Tu profe de Ecuaciones Diferenciales';
  if (chat.mensajes.length) bajar(); else chatEl.scrollTop = 0;
}
function bajar() { requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; }); }

function pintarPrevias() {
  $('#previas').innerHTML = fotos.map((f, i) => `<div class="previa"><img src="${f}" alt="Foto por enviar"><button data-quitar="${i}" aria-label="Quitar foto">✕</button></div>`).join('');
  actualizarBoton();
}
function actualizarBoton() { enviarEl.disabled = ocupado || (!textoEl.value.trim() && !fotos.length); }

async function pintarLista() {
  const todos = await DB.todos();
  $('#lista').innerHTML = todos.length ? todos.map(c => `<div class="item ${chat && c.id === chat.id ? 'on' : ''}">
      <button class="abrir" data-abrir="${c.id}"><b>${esc(c.titulo)}</b><small>${new Date(c.actualizado).toLocaleString('es-PE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</small></button>
      <button class="borrar" data-borrar="${c.id}" aria-label="Borrar conversación">🗑</button></div>`).join('')
    : '<p style="color:var(--texto2);font-size:14px;padding:0 4px">Aún no tienes conversaciones guardadas.</p>';
}

/* ===================== Envío y respuesta en vivo ===================== */
function mensajesApi() { return chat.mensajes.map(m => ({ role: m.role, content: m.content })); }

async function enviar(textoForzado, completoForzado) {
  if (ocupado) return;
  const texto = (textoForzado ?? textoEl.value).trim();
  const completo = completoForzado ?? modoCompleto;
  if (!texto && !fotos.length && textoForzado === undefined) return;
  const bloques = fotos.map(f => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: f.split(',')[1] } }));
  const cuerpo = (completo ? '[Modo: solución completa]\n' : '') + (texto || 'Te mando la foto de un ejercicio. Ayúdame con él.');
  bloques.push({ type: 'text', text: cuerpo });

  const ult = chat.mensajes[chat.mensajes.length - 1];
  if (ult && ult.role === 'user') {          // el envío anterior falló: se juntan en un solo mensaje
    ult.content = [...ult.content, ...bloques];
    ult.ui.texto = [ult.ui.texto, texto].filter(Boolean).join('\n');
    ult.ui.fotos = [...(ult.ui.fotos || []), ...fotos];
  } else {
    chat.mensajes.push({ role: 'user', content: bloques, ui: { texto, fotos: [...fotos], completo } });
  }
  if (chat.mensajes.length === 1) chat.titulo = texto ? (texto.length > 42 ? texto.slice(0, 40) + '…' : texto) : 'Ejercicio con foto';
  chat.actualizado = Date.now();
  fotos = []; if (textoForzado === undefined) { textoEl.value = ''; autoAltura(); }
  pintarPrevias(); pintar(); DB.guardar(chat);
  await pedirRespuesta();
}

async function pedirRespuesta() {
  ocupado = true; actualizarBoton();
  chatEl.querySelector('.acciones')?.remove();
  const fila = document.createElement('div');
  fila.className = 'msg profe';
  fila.innerHTML = `<div class="avatar mini" aria-hidden="true">y'</div><div class="burbuja"><span class="pensando"><i></i><i></i><i></i>&nbsp;Pensando…</span></div>`;
  chatEl.appendChild(fila); bajar();
  const burbuja = fila.querySelector('.burbuja');

  const bloques = []; let parada = null, error = null, pendiente = false;
  const textoActual = () => bloques.filter(b => b && b.type === 'text').map(b => b.text).join('');
  const refrescar = () => {
    if (pendiente) return; pendiente = true;
    requestAnimationFrame(() => {
      pendiente = false;
      const t = textoActual();
      if (t) { burbuja.innerHTML = renderizar(t); burbuja.classList.add('cursor'); }
      const cerca = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 160;
      if (cerca) chatEl.scrollTop = chatEl.scrollHeight;
    });
  };

  try {
    const resp = await fetch(API.replace(/\/$/, '') + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Codigo': ls.get('pe_codigo') || '' },
      body: JSON.stringify({ messages: mensajesApi() }),
    });
    if (!resp.ok) {
      let msg = 'No me pude conectar.';
      try { msg = (await resp.json()).error || msg; } catch {}
      if (resp.status === 401) { pedirCodigo('Tu código de acceso cambió. Escríbelo de nuevo.'); }
      throw new Error(msg);
    }
    const lector = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await lector.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let corte;
      while ((corte = buf.indexOf('\n\n')) >= 0) {
        const evento = buf.slice(0, corte); buf = buf.slice(corte + 2);
        const linea = evento.split('\n').find(l => l.startsWith('data:'));
        if (!linea) continue;
        let d; try { d = JSON.parse(linea.slice(5).trim()); } catch { continue; }
        if (d.type === 'content_block_start') { bloques[d.index] = { ...d.content_block }; }
        else if (d.type === 'content_block_delta') {
          const b = bloques[d.index]; if (!b) continue;
          const x = d.delta;
          if (x.type === 'text_delta') { b.text = (b.text || '') + x.text; refrescar(); }
          else if (x.type === 'thinking_delta') b.thinking = (b.thinking || '') + x.thinking;
          else if (x.type === 'signature_delta') b.signature = (b.signature || '') + x.signature;
        }
        else if (d.type === 'message_delta') parada = d.delta && d.delta.stop_reason;
        else if (d.type === 'error') throw new Error(d.error && d.error.message ? 'La IA tuvo un problema: ' + d.error.message : 'La IA tuvo un problema.');
      }
    }
    if (!parada) throw new Error('Se cortó la conexión antes de terminar.');
  } catch (e) { error = e.message || String(e); }

  ocupado = false; burbuja.classList.remove('cursor');
  const texto = textoActual();
  if (!error && parada === 'refusal' && !texto) error = 'Esa pregunta no la puedo responder. Prueba reformulándola.';
  if (!error && !texto) error = 'La respuesta llegó vacía.';
  if (error) {
    fila.remove();
    const av = document.createElement('div'); av.className = 'aviso';
    av.innerHTML = `${esc(error)} <button>Reintentar</button>`;
    av.querySelector('button').onclick = () => { av.remove(); pedirRespuesta(); };
    chatEl.appendChild(av); bajar(); actualizarBoton(); return;
  }
  let textoFinal = texto;
  if (parada === 'max_tokens') textoFinal += '\n\n*(La respuesta quedó larga y se cortó. Escríbeme "continúa".)*';
  chat.mensajes.push({ role: 'assistant', content: bloques.filter(Boolean), ui: { texto: textoFinal } });
  chat.actualizado = Date.now();
  await DB.guardar(chat);
  pintar(); actualizarBoton();
}

/* ===================== Código de acceso ===================== */
function pedirCodigo(msg) { $('#errAcceso').textContent = msg || ''; $('#acceso').classList.add('on'); setTimeout(() => $('#codigo').focus(), 50); }
$('#fAcceso').addEventListener('submit', async e => {
  e.preventDefault();
  const c = $('#codigo').value.trim(); if (!c) return;
  $('#errAcceso').textContent = 'Revisando…';
  try {
    const r = await fetch(API.replace(/\/$/, '') + '/verificar', { method: 'POST', headers: { 'X-Codigo': c } });
    if (r.ok) { ls.set('pe_codigo', c); $('#acceso').classList.remove('on'); $('#codigo').value = ''; return; }
    let m = 'Ese código no es correcto.'; try { m = (await r.json()).error || m; } catch {}
    $('#errAcceso').textContent = m;
  } catch { $('#errAcceso').textContent = 'No me pude conectar. Revisa tu internet.'; }
});

/* ===================== Eventos ===================== */
function autoAltura() { textoEl.style.height = 'auto'; textoEl.style.height = Math.min(textoEl.scrollHeight, 140) + 'px'; }
textoEl.addEventListener('input', () => { autoAltura(); actualizarBoton(); });
textoEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); if (!enviarEl.disabled) enviar(); } });
enviarEl.onclick = () => enviar();
$('#bFoto').onclick = () => $('#archivo').click();
$('#archivo').onchange = async e => {
  for (const f of [...e.target.files].slice(0, MAX_FOTOS - fotos.length)) {
    try { fotos.push(await comprimir(f)); } catch (err) { alert(err.message); }
  }
  e.target.value = ''; pintarPrevias();
};
$('#previas').onclick = e => { const b = e.target.closest('[data-quitar]'); if (b) { fotos.splice(+b.dataset.quitar, 1); pintarPrevias(); } };
$('#mPaso').onclick = () => { modoCompleto = false; $('#mPaso').classList.add('on'); $('#mTodo').classList.remove('on'); };
$('#mTodo').onclick = () => { modoCompleto = true; $('#mTodo').classList.add('on'); $('#mPaso').classList.remove('on'); };
chatEl.addEventListener('click', e => {
  const tema = e.target.closest('[data-tema]');
  if (tema) return enviar(`Explícame "${tema.dataset.tema}" desde cero: la idea, cuándo se usa, el método y un ejemplo corto resuelto.`, false);
  const r = e.target.closest('[data-rapido]');
  if (r) return enviar(r.dataset.rapido, !!r.dataset.completo);
  const img = e.target.closest('.fotos img');
  if (img) { $('#visor img').src = img.src; $('#visor').classList.add('on'); }
});
$('#visor').onclick = () => $('#visor').classList.remove('on');
const abrirCajon = on => { $('#cajon').classList.toggle('on', on); $('#velo').classList.toggle('on', on); if (on) pintarLista(); };
$('#bHistorial').onclick = () => abrirCajon(true);
$('#velo').onclick = () => abrirCajon(false);
$('#bNueva').onclick = () => { if (!ocupado) nuevoChat(); };
$('#bNueva2').onclick = () => { if (!ocupado) { nuevoChat(); abrirCajon(false); } };
$('#bSalir').onclick = () => { ls.del('pe_codigo'); abrirCajon(false); pedirCodigo(); };
$('#lista').onclick = async e => {
  const a = e.target.closest('[data-abrir]'), b = e.target.closest('[data-borrar]');
  if (a && !ocupado) { chat = (await DB.todos()).find(c => c.id === a.dataset.abrir) || chat; pintar(); abrirCajon(false); }
  if (b && confirm('¿Borrar esta conversación?')) { await DB.borrar(b.dataset.borrar); if (chat.id === b.dataset.borrar) nuevoChat(); pintarLista(); }
};

/* ===================== Inicio ===================== */
window.addEventListener('load', async () => {
  await DB.abrir();
  const todos = await DB.todos();
  const reciente = todos[0];
  if (reciente && Date.now() - reciente.actualizado < 3 * 3600e3) { chat = reciente; pintar(); } else nuevoChat();
  if (!ls.get('pe_codigo')) pedirCodigo();
});
</script>
